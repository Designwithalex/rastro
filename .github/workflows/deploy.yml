name: Deploy a Hostinger

# Se despliega solo lo que está en main. El QA final decide qué llega acá.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  ftp:
    name: Sincronizar por FTP
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Subir a public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          # FTPS: la sesión va cifrada con TLS sobre el puerto 21 (explícito).
          # Con `ftp` a secas, el usuario y la contraseña de Hostinger viajan
          # en texto plano por la red del runner. Si un deploy falla acá con un
          # error de handshake TLS, ver docs/DEPLOY.md antes de volver a `ftp`.
          protocol: ftps
          server-dir: /public_html/
          # Sube solo lo que el sitio necesita para correr.
          #
          # DOS COSAS NO SE SINCRONIZAN, Y POR RAZONES DISTINTAS:
          #
          # app/config.php  — son credenciales. Vive únicamente en el
          #   servidor y nunca sale del repo (CLAUDE.md §7.1).
          #
          # data/**  — desde que existe el panel de administración, los JSON
          #   de data/ los ESCRIBE EL CLIENTE en el servidor. Si el deploy
          #   los sincronizara, cada push que tocara un mock borraría de un
          #   saque los productos, los precios y los banners que cargaron,
          #   sin aviso y sin forma de recuperarlos: no hay base de datos
          #   con backup atrás. Los del repo son la semilla, no la verdad.
          #   Se suben UNA vez, a mano, cuando se monta el servidor, y de
          #   ahí en adelante mandan los del servidor. Está explicado en
          #   docs/DEPLOY.md, "Los datos viven en el servidor".
          #
          #   Ojo al agregar un data/*.json nuevo: no llega solo, hay que
          #   subirlo a mano igual que la primera vez.
          #
          # assets/img/subidas/ SÍ se sincroniza, pero sólo su .htaccess:
          # las imágenes que sube el cliente no están en el repo y la acción
          # no borra lo que nunca subió.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.DS_Store
            **/docs/**
            **/design/**
            **/bin/**
            **/*.md
            **/app/config.php
            **/data/**
            **/node_modules/**
