name: Deploy a Hostinger

# Se despliega solo lo que está en main. El QA final decide qué llega acá.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  ftp:
    name: Sincronizar por FTP
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Subir a public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          # FTPS: la sesión va cifrada con TLS sobre el puerto 21 (explícito).
          # Con `ftp` a secas, el usuario y la contraseña de Hostinger viajan
          # en texto plano por la red del runner. Si un deploy falla acá con un
          # error de handshake TLS, ver docs/DEPLOY.md antes de volver a `ftp`.
          protocol: ftps
          # La raíz del usuario FTP YA ES la raíz del sitio: index.php y
          # .htaccess están ahí, y /public_html/ directamente no existe
          # (el servidor contesta 550). Hasta el 11/09/2026 la cuenta vieja
          # sí tenía esa carpeta, y por eso decía /public_html/.
          #
          # Con la ruta vieja el deploy no falla de forma visible: crea un
          # public_html/ adentro del sitio, sube todo ahí, y el sitio sigue
          # sirviendo lo de antes. Se ve verde y no cambió nada.
          server-dir: ./
          # Sube solo lo que el sitio necesita para correr.
          #
          # DOS COSAS NO SE SINCRONIZAN, Y POR RAZONES DISTINTAS:
          #
          # app/config.php  — son credenciales: las claves de la base, el
          #   access token de Mercado Pago y el usuario del panel. Vive
          #   únicamente en el servidor y nunca sale del repo (CLAUDE.md §7.1).
          #
          # data/**  — todo lo de data/ lo ESCRIBE EL SERVIDOR, y por dos
          #   caminos distintos: el cliente desde el panel de administración
          #   (productos, precios, banners) y el sitio solo (los pedidos del
          #   checkout en pedidos.json y la bitácora de Mercado Pago en
          #   mp-eventos.log). Si el deploy los sincronizara, cada push que
          #   tocara un mock borraría de un saque la carga del cliente y los
          #   pedidos de producción, sin aviso y sin forma de recuperarlos:
          #   no hay base de datos con backup atrás.
          #
          #   Los JSON del repo son la semilla, no la verdad. Se suben UNA
          #   vez, a mano, cuando se monta el servidor. Está explicado en
          #   docs/DEPLOY.md, "Los datos viven en el servidor".
          #
          #   Excluir la carpeta entera y no archivo por archivo es a
          #   propósito: pedidos.json y mp-eventos.log ya están en
          #   .gitignore, pero una exclusión por nombre deja de proteger el
          #   día que alguien haga un `git add -f` de apuro, o el día que
          #   aparezca un data/*.json nuevo que nadie se acuerde de sumar
          #   a esta lista.
          #
          #   Ojo al agregar un data/*.json nuevo: no llega solo, hay que
          #   subirlo a mano igual que la primera vez.
          #
          # db/  — el esquema y las migraciones. El sitio no los necesita
          #   para correr: los lee un humano desde su máquina cuando monta
          #   la base. Sincronizarlos los dejaría en
          #   rastrofitness.com/db/esquema.sql, que es la lista completa de
          #   tablas y columnas servida a quien la pida. Ver docs/MYSQL.md.
          #
          # assets/img/subidas/ SÍ se sincroniza, pero sólo su .htaccess:
          # las imágenes que sube el cliente no están en el repo y la acción
          # no borra lo que nunca subió.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.DS_Store
            **/docs/**
            **/design/**
            **/bin/**
            **/db/**
            **/*.md
            **/app/config.php
            **/data/**
            **/node_modules/**
