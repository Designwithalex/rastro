<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Foto de producto pendiente">
  <!-- Marcador para los productos que todavía no tienen fotografía.
       Usa el mismo image well claro que la card de producto. -->
  <rect width="800" height="800" fill="#e9e9e9"/>
  <g stroke="#c4c4c4" stroke-width="1" fill="none">
    <path d="M0 200h800M0 600h800M200 0v800M600 0v800"/>
    <rect x="200" y="200" width="400" height="400"/>
    <path d="M200 200l400 400M600 200L200 600"/>
  </g>
  <circle cx="400" cy="400" r="86" fill="#e9e9e9" stroke="#8a8a8a" stroke-width="1"/>
  <text x="400" y="405" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="17" font-weight="700" letter-spacing="1.2" fill="#666666">FOTO</text>
  <text x="400" y="428" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="11" font-weight="700" letter-spacing="1.2" fill="#8a8a8a">PENDIENTE</text>
</svg>
